<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cheese cube squishy toys, cuboid slow-rise memory foam">
  <rect width="400" height="300" fill="#EDEAEA"/>
  <ellipse cx="200" cy="248" rx="150" ry="20" fill="#DCD7D6"/>

  <!-- left cube -->
  <g transform="translate(140,140)">
    <path d="M-70,-40 L10,-60 L80,-30 L0,-8 Z" fill="#FDE9A0"/>
    <path d="M-70,-40 L0,-8 L0,70 L-70,40 Z" fill="#F6D876"/>
    <path d="M80,-30 L0,-8 L0,70 L80,42 Z" fill="#EFC762"/>
    <!-- holes -->
    <circle cx="-38" cy="10" r="9" fill="#E9BE54"/>
    <circle cx="-15" cy="38" r="6" fill="#E9BE54"/>
    <circle cx="35" cy="6" r="8" fill="#DDAE49"/>
    <circle cx="50" cy="30" r="5" fill="#DDAE49"/>
    <circle cx="-20" cy="-20" r="5" fill="#F0D07A"/>
  </g>

  <!-- right cube (squeezed, irregular) -->
  <g transform="translate(270,145)">
    <path d="M-60,-46 Q-10,-66 55,-38 Q66,-10 40,20 Q0,50 -50,30 Q-72,-6 -60,-46 Z" fill="#FBE7A2" stroke="#EAC96C" stroke-width="3"/>
    <circle cx="-25" cy="-10" r="9" fill="#E9BE54"/>
    <circle cx="10" cy="8" r="7" fill="#E9BE54"/>
    <circle cx="-8" cy="18" r="5" fill="#DDAE49"/>
    <circle cx="28" cy="-14" r="6" fill="#DDAE49"/>
  </g>

  <!-- hand hint -->
  <ellipse cx="230" cy="235" rx="42" ry="24" fill="#F4C9A0" opacity="0.85"/>
</svg>
