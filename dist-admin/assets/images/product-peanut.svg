<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Peanut shaped squishy toy being squeezed">
  <rect width="400" height="300" fill="#F1E4C9"/>

  <g transform="translate(200,150) rotate(-18)">
    <!-- peanut shell left lobe -->
    <path d="M-90,0 C-95,-45 -55,-58 -20,-40 C-8,-33 -8,-33 0,-33
             C8,-33 8,-33 20,-40 C55,-58 95,-45 90,0
             C95,45 55,58 20,40 C8,33 8,33 0,33
             C-8,33 -8,33 -20,40 C-55,58 -95,45 -90,0 Z"
          fill="#E3C48C" stroke="#C9A268" stroke-width="3"/>
    <path d="M-60,-30 Q-40,-10 -60,10 Q-40,30 -60,30" fill="none" stroke="#C9A268" stroke-width="2.5" opacity="0.7"/>
    <path d="M60,-30 Q40,-10 60,10 Q40,30 60,30" fill="none" stroke="#C9A268" stroke-width="2.5" opacity="0.7"/>
    <path d="M-20,-38 Q0,-30 20,-38" fill="none" stroke="#C9A268" stroke-width="2.5"/>
    <path d="M-20,38 Q0,30 20,38" fill="none" stroke="#C9A268" stroke-width="2.5"/>
  </g>

  <!-- squished cream filling peeking from a torn top -->
  <g transform="translate(200,95)">
    <path d="M-38,10 Q-30,-22 0,-24 Q30,-22 38,10 Q10,26 0,26 Q-10,26 -38,10 Z" fill="#FFF7E8" stroke="#F0E3C6" stroke-width="2"/>
  </g>

  <!-- hand squeezing hint -->
  <ellipse cx="120" cy="215" rx="46" ry="30" fill="#F4C9A0" opacity="0.9"/>
  <ellipse cx="285" cy="205" rx="40" ry="26" fill="#F4C9A0" opacity="0.9"/>
</svg>
