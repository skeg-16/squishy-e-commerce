<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cat paw squishy toys with pink pads">
  <rect width="400" height="300" fill="#EDE7EF"/>
  <g opacity="0.5" stroke="#D9D0DE" stroke-width="1.5">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="90" x2="400" y2="90"/>
    <line x1="0" y1="140" x2="400" y2="140"/>
    <line x1="0" y1="190" x2="400" y2="190"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
  </g>

  <!-- paw template, reused -->
  <defs>
    <g id="paw">
      <ellipse cx="0" cy="18" rx="34" ry="26" fill="#FFFFFF"/>
      <ellipse cx="0" cy="18" rx="19" ry="15" fill="#FFB6C9"/>
      <circle cx="-30" cy="-14" r="12" fill="#FFFFFF"/>
      <circle cx="-30" cy="-14" r="6" fill="#FFB6C9"/>
      <circle cx="-11" cy="-27" r="12" fill="#FFFFFF"/>
      <circle cx="-11" cy="-27" r="6" fill="#FFB6C9"/>
      <circle cx="13" cy="-27" r="12" fill="#FFFFFF"/>
      <circle cx="13" cy="-27" r="6" fill="#FFB6C9"/>
      <circle cx="30" cy="-14" r="12" fill="#FFFFFF"/>
      <circle cx="30" cy="-14" r="6" fill="#FFB6C9"/>
    </g>
  </defs>

  <use href="#paw" x="90" y="90" transform="rotate(-8 90 90)"/>
  <use href="#paw" x="200" y="70" transform="rotate(5 200 70)"/>
  <use href="#paw" x="310" y="100" transform="rotate(-4 310 100)"/>
  <use href="#paw" x="130" y="190" transform="rotate(10 130 190)"/>
  <use href="#paw" x="260" y="200" transform="rotate(-10 260 200)"/>
</svg>
