<svg viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Collage of six kawaii squishy toys: bread, peach, chick, cat, cloud, and bunny">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3E9"/>
      <stop offset="100%" stop-color="#FFE3EE"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2D1B3D" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="420" height="420" rx="28" fill="url(#bgGrad)"/>

  <!-- grid dividers (subtle) -->
  <g stroke="#ffffff" stroke-width="6" opacity="0.6">
    <line x1="140" y1="16" x2="140" y2="404"/>
    <line x1="280" y1="16" x2="280" y2="404"/>
    <line x1="16" y1="210" x2="404" y2="210"/>
  </g>

  <!-- Bread squishy -->
  <g transform="translate(70,105)" filter="url(#soft)">
    <path d="M-52,-30 Q-52,-70 0,-70 Q52,-70 52,-30 L52,55 Q52,65 42,65 L-42,65 Q-52,65 -52,55 Z" fill="#F6D9A8" stroke="#E2B979" stroke-width="4"/>
    <path d="M-38,-32 Q-38,-56 0,-56 Q38,-56 38,-32" fill="none" stroke="#E2B979" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-16" cy="10" r="4" fill="#2D1B3D"/>
    <circle cx="16" cy="10" r="4" fill="#2D1B3D"/>
    <path d="M-13,24 Q0,32 13,24" fill="none" stroke="#2D1B3D" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="-24" cy="20" rx="8" ry="5" fill="#FF9FB0" opacity="0.7"/>
    <ellipse cx="24" cy="20" rx="8" ry="5" fill="#FF9FB0" opacity="0.7"/>
  </g>

  <!-- Peach squishy -->
  <g transform="translate(210,105)" filter="url(#soft)">
    <path d="M0,-55 C40,-55 55,-15 45,20 C37,50 15,62 0,62 C-15,62 -37,50 -45,20 C-55,-15 -40,-55 0,-55 Z" fill="#FF9EB0"/>
    <path d="M0,-55 C-8,-40 -8,-20 0,-8 C8,-20 8,-40 0,-55 Z" fill="#FFB9C6"/>
    <path d="M-4,-58 Q0,-68 8,-64" fill="none" stroke="#6FAE72" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-15" cy="10" r="4" fill="#2D1B3D"/>
    <circle cx="15" cy="10" r="4" fill="#2D1B3D"/>
    <path d="M-12,24 Q0,31 12,24" fill="none" stroke="#2D1B3D" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="-23" cy="18" rx="7" ry="4.5" fill="#D6577A" opacity="0.5"/>
    <ellipse cx="23" cy="18" rx="7" ry="4.5" fill="#D6577A" opacity="0.5"/>
  </g>

  <!-- Chick squishy -->
  <g transform="translate(350,105)" filter="url(#soft)">
    <circle cx="0" cy="0" r="52" fill="#FFDD6B"/>
    <path d="M-14,-52 Q-8,-64 0,-52 Q8,-64 14,-52" fill="none" stroke="#FFDD6B" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-16" cy="-6" r="4" fill="#2D1B3D"/>
    <circle cx="16" cy="-6" r="4" fill="#2D1B3D"/>
    <path d="M-6,6 L6,6 L0,14 Z" fill="#FF9B3E"/>
    <ellipse cx="-26" cy="6" rx="7" ry="4.5" fill="#FF9FB0" opacity="0.8"/>
    <ellipse cx="26" cy="6" rx="7" ry="4.5" fill="#FF9FB0" opacity="0.8"/>
  </g>

  <!-- Cat squishy -->
  <g transform="translate(70,300)" filter="url(#soft)">
    <path d="M-34,-42 L-18,-16 L-4,-40 Z" fill="#FFF6EF"/>
    <path d="M34,-42 L18,-16 L4,-40 Z" fill="#FFF6EF"/>
    <circle cx="0" cy="6" r="54" fill="#FFF6EF" stroke="#EADFD3" stroke-width="3"/>
    <path d="M-18,4 Q-8,-6 0,4" fill="none" stroke="#2D1B3D" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-16" cy="10" r="4" fill="#2D1B3D"/>
    <circle cx="16" cy="10" r="4" fill="#2D1B3D"/>
    <path d="M-12,26 Q0,33 12,26" fill="none" stroke="#2D1B3D" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="-26" cy="22" rx="7" ry="4.5" fill="#FF9FB0" opacity="0.8"/>
    <ellipse cx="26" cy="22" rx="7" ry="4.5" fill="#FF9FB0" opacity="0.8"/>
    <g stroke="#D9CDBF" stroke-width="2">
      <line x1="-56" y1="10" x2="-30" y2="14"/>
      <line x1="-56" y1="22" x2="-30" y2="20"/>
      <line x1="56" y1="10" x2="30" y2="14"/>
      <line x1="56" y1="22" x2="30" y2="20"/>
    </g>
  </g>

  <!-- Cloud squishy -->
  <g transform="translate(210,300)" filter="url(#soft)">
    <path d="M-48,14 a24,24 0 0,1 12,-38 a28,28 0 0,1 52,-6 a22,22 0 0,1 8,42 Z" fill="#FFFFFF" stroke="#EDE6F5" stroke-width="3"/>
    <circle cx="-14" cy="8" r="4" fill="#2D1B3D"/>
    <circle cx="14" cy="8" r="4" fill="#2D1B3D"/>
    <path d="M-11,20 Q0,27 11,20" fill="none" stroke="#2D1B3D" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="-22" cy="16" rx="6" ry="4" fill="#FF9FB0" opacity="0.8"/>
    <ellipse cx="22" cy="16" rx="6" ry="4" fill="#FF9FB0" opacity="0.8"/>
  </g>

  <!-- Bunny squishy -->
  <g transform="translate(350,300)" filter="url(#soft)">
    <path d="M-22,-30 Q-30,-70 -14,-72 Q-2,-72 -6,-34 Z" fill="#FFB6C9"/>
    <path d="M22,-30 Q30,-70 14,-72 Q2,-72 6,-34 Z" fill="#FFB6C9"/>
    <path d="M-16,-30 Q-20,-58 -12,-60 Q-6,-60 -8,-32 Z" fill="#FF87A3"/>
    <path d="M16,-30 Q20,-58 12,-60 Q6,-60 8,-32 Z" fill="#FF87A3"/>
    <circle cx="0" cy="6" r="46" fill="#FFC3D3"/>
    <circle cx="-14" cy="2" r="4" fill="#2D1B3D"/>
    <circle cx="14" cy="2" r="4" fill="#2D1B3D"/>
    <path d="M-10,16 Q0,22 10,16" fill="none" stroke="#2D1B3D" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- floating paw accent -->
  <g transform="translate(210,210)" filter="url(#soft)">
    <ellipse cx="0" cy="10" rx="20" ry="16" fill="#FFFFFF"/>
    <ellipse cx="0" cy="10" rx="11" ry="9" fill="#FF9FB0"/>
    <circle cx="-18" cy="-8" r="7" fill="#FFFFFF"/>
    <circle cx="-6" cy="-16" r="7" fill="#FFFFFF"/>
    <circle cx="8" cy="-16" r="7" fill="#FFFFFF"/>
    <circle cx="20" cy="-8" r="7" fill="#FFFFFF"/>
  </g>
</svg>
