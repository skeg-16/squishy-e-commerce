<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Squishies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo-mark.svg">
</head>
<body class="adm-body">

  <!-- Login -->
  <main id="login" class="adm-login" hidden>
    <form id="loginForm" class="adm-card adm-login__card" autocomplete="on">
      <img src="assets/images/logo-mark.svg" alt="" width="48" height="48">
      <h1>Squishies Admin</h1>
      <label class="adm-field">
        <span>Password</span>
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="loginError" class="adm-error" role="alert"></p>
      <button class="btn btn--pink" type="submit">Log in</button>
    </form>
  </main>

  <!-- App -->
  <div id="app" hidden>
    <header class="adm-header">
      <a href="admin.html" class="adm-brand">
        <img src="assets/images/logo-mark.svg" alt="" width="32" height="32">
        <span>Squishies <small>Admin</small></span>
      </a>
      <nav id="tabs" class="adm-tabs" aria-label="Admin sections"></nav>
      <div class="adm-header__actions">
        <a class="btn btn--outline btn--sm" href="index.html" target="_blank" rel="noopener">View store</a>
        <button id="logout" class="btn btn--dark btn--sm" type="button">Log out</button>
      </div>
    </header>
    <main class="adm-main">
      <h1 id="viewTitle" class="adm-title"></h1>
      <div id="view" aria-live="polite"></div>
    </main>
  </div>

  <dialog id="dialog" class="adm-dialog" aria-labelledby="dialogTitle">
    <div class="adm-dialog__box">
      <header class="adm-dialog__head">
        <h2 id="dialogTitle"></h2>
        <button id="dialogClose" class="adm-icon-btn" type="button" aria-label="Close">×</button>
      </header>
      <div id="dialogBody" class="adm-dialog__body"></div>
    </div>
  </dialog>

  <div id="toast" class="adm-toast" role="status" aria-live="polite"></div>

  <script src="js/admin.js"></script>
</body>
</html>
